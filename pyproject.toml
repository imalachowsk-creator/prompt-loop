[project]
name = "promptloop"
version = "0.1.0"
description = "Continuous prompt improvement for an agentic documentation assistant: eval -> feedback -> prompt -> run"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
promptloop = "promptloop.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
