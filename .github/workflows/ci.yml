name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Unit tests
        run: pytest -q
      - name: Eval gate on held-out test split (mock model)
        run: |
          python -m promptloop --llm mock eval --split test --min-score 0.4
      - name: Improvement loop smoke test (mock model)
        run: |
          mkdir -p /tmp/p && cp prompts/v1.md /tmp/p/
          python -m promptloop --llm mock --prompts /tmp/p --runs /tmp/r improve --iterations 2
          