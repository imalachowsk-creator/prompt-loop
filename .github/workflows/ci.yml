name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Unit tests
        run: pytest -q
      - name: Eval gate (mock model) - prompt changes must not drop the score
        run: |
          python -m promptloop --llm mock eval --min-score 0.5
